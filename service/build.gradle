plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.boot.dependency.management)
}

dependencies {

    // Spring Boot
    implementation libs.spring.boot.webflux
    implementation libs.spring.boot.webclient
    implementation libs.spring.boot.actuator
    implementation libs.spring.boot.validation

    // Lombok
    compileOnly libs.lombok

    // MapStruct core annotations
    implementation libs.mapstruct

    // Annotation processors
    annotationProcessor libs.bundles.annotation.processors
    testAnnotationProcessor libs.bundles.annotation.processors

    // Utils
    implementation libs.commons.lang3
    implementation libs.micrometer.context.propagation

    implementation projects.serviceApiContract

    // Test
    testCompileOnly libs.lombok
    testRuntimeOnly libs.junit.platform.launcher

    testImplementation libs.archunit
    testImplementation libs.spring.boot.webflux.test
    testImplementation libs.spring.boot.actuator.test
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('unitTest', Test) {
    description = 'Runs unit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'unit'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('unitTest')
}

tasks.register('functionalTest', Test) {
    description = 'Runs functional tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'functional'
    }
    shouldRunAfter tasks.named('integrationTest')
}

tasks.register('architectureTest', Test) {
    description = 'Runs architecture tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/HexagonalArchitectureTest.class'
    shouldRunAfter tasks.named('unitTest')
}
